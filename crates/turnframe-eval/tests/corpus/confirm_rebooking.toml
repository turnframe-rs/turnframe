id = "trip.confirm_rebooking"
name = "Confirming the rebooking card sends it, with no model call at all"
description = """
The turn carries only a card answer. Its meaning is the stored option, so the \
runtime never calls a model — the scripted provider in this corpus's harness \
answers nothing, and a green run is itself the proof. The card is named by its \
case, because no file can know the identifier the previous turn minted.
"""
tags = ["trip", "interaction"]

[turn.reply]
workflow = "trip"
case_id = "trip-1"
option = "confirm"

[expect]
acts = []
commands = ["trip.rebook"]
events = ["trip.rebooking_sent"]

[[expect.case_revision]]
workflow = "trip"
case_id = "trip-1"
revision = 8

[[expect.interaction_status]]
workflow = "trip"
case_id = "trip-1"
statuses = ["resolved"]

[expect.forbid]
commands = ["trip.withdraw", "trip.set_name"]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Trip 1"
revision = 7

[setup.cases.state]
status = "awaiting_rebooking_confirmation"
external_status = "awaiting_confirmation"
name = "Lisbon, September"
travel_date = "2026-10-31"

[setup.cases.state.traveler]
traveler_id = "5c1e0000-0000-4000-8000-000000000001"
display_name = "Marta Bianchi"

[[setup.cases.state.extras]]
extra_id = "11111111-1111-4111-8111-111111111111"
description = "Checked bag"
quantity = 1
unit_price_cents = 25000
payer = "airline"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

[setup.cases.state.offer]
leg = 1
flight = "AZ612"
departs = "2026-10-05 13:10"
fare_difference_cents = 8400

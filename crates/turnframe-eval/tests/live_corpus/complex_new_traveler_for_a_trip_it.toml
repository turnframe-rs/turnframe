id = "complex.new_traveler_for_a_trip.it"
name = "Una viaggiatrice registrata e messa sul viaggio nello stesso messaggio"
tags = ["complex", "it"]
description = "The traveler does not exist yet: the message registers it, links it to the trip, and adds an extra."

[turn]
text = "Registra la viaggiatrice Nadia Rinaldi, email nadia@rinaldi.example, e mettila su questo viaggio; poi aggiungi due notti d'albergo a 400 euro l'una."
locale = "it-IT"

[setup]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Viaggio 1"
revision = 1

[setup.cases.state]
status = "draft"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

[expect]

[[expect.case_state]]
case_id = "trip-1"
path = "/traveler/display_name"
equals = "Nadia Rinaldi"
ignore_case = true

[[expect.case_state]]
case_id = "trip-1"
path = "/extras/0/quantity"
equals = 2

[[expect.case_state]]
case_id = "trip-1"
path = "/extras/0/unit_price_cents"
equals = 40000

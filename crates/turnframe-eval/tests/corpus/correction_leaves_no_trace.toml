id = "trip.correction_leaves_no_trace"
name = "A correction inside the same turn commits nothing"
description = """
The user asks for a change and takes it back in the same sentence. Whole-turn \
planning means the change never reaches the domain at all, so there is no \
command, no event, and the revision does not move.
"""
tags = ["trip", "safety"]

[turn]
text = "Set the name to Lisbon, actually leave it alone"
locale = "en-GB"

[expect]
commands = []
events = []

[[expect.case_revision]]
workflow = "trip"
case_id = "trip-1"
revision = 3

[expect.forbid]
commands = ["trip.set_name", "trip.rebook"]
events = ["trip.name_set"]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Trip 1"
revision = 3

[setup.cases.state]
status = "draft"

[setup.cases.state.traveler]
traveler_id = "5c1e0000-0000-4000-8000-000000000001"
display_name = "Marta Bianchi"

[[setup.cases.state.extras]]
extra_id = "11111111-1111-4111-8111-111111111111"
description = "Checked bag"
quantity = 1
unit_price_cents = 25000
payer = "airline"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

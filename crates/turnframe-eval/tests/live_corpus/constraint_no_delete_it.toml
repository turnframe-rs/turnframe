id = "constraint.no_delete.it"
name = "«Non cancellare niente» con una modifica permessa"
tags = ["constraint", "it"]

[turn]
text = "non cancellare niente, cambia solo il nome in Porto"
locale = "it-IT"

[setup]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Trip 1"
revision = 3

[setup.cases.state]
status = "draft"
name = "Lisbon, September"
travel_date = "2026-10-31"

[setup.cases.state.traveler]
traveler_id = "5c1e0000-0000-4000-8000-000000000001"
display_name = "Marta Bianchi"

[[setup.cases.state.extras]]
extra_id = "4cd2bc71-4b2e-87e2-a6a2-f7436f18babe"
description = "Checked bag"
quantity = 1
unit_price_cents = 25000
payer = "airline"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

[expect]
events = ["trip.name_set"]

[expect.forbid]
commands = ["trip.withdraw"]

[[expect.case_state]]
case_id = "trip-1"
path = "/name"
equals = "Porto"
ignore_case = true

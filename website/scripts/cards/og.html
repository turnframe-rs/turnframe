<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<!-- The social card, drawn from the design system's cover: a turn hardening on a timeline.
     Rendered to public/og.png by scripts/cards.mjs. -->
<link rel="stylesheet" href="../../src/styles/tokens.css">
<style>
  @font-face { font-family: "Martian Mono"; src: url("../../public/fonts/MartianMono-Variable.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; }
  @font-face { font-family: "IBM Plex Sans"; src: url("../../public/fonts/IBMPlexSans-Variable.woff2") format("woff2"); font-weight: 100 700; }
  html, body { margin: 0; background: var(--bg); }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--bg);
    background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 32px 32px; background-position: -1px -1px; }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 40%, transparent 60%); }
  svg { position: absolute; inset: 0; }
  .tick { stroke: var(--line-strong); stroke-width: 1.5; }
  .track { stroke: var(--line); stroke-width: 1.5; }
  .blue { fill: var(--blue); } .ink { fill: var(--ink); } .lime { fill: var(--lime); }
  .kf { fill: var(--bg); stroke: var(--ink); stroke-width: 2.5; }
  .kf-on { fill: var(--lime); stroke: var(--ink); stroke-width: 2.5; }
  .head { stroke: var(--red); stroke-width: 2.5; } .headfill { fill: var(--red); }
  .text { position: absolute; z-index: 2; left: 72px; top: 72px; bottom: 64px; width: 640px; display: flex; flex-direction: column; }
  .mark { display: flex; align-items: center; gap: 18px; font: 600 40px/1 var(--font-display); letter-spacing: -0.045em; color: var(--ink); }
  .mark .br { fill: none; stroke: var(--ink); stroke-width: 3; } .mark .kf2 { fill: var(--blue); }
  h1 { margin: auto 0 0; font: 800 50px/56px var(--font-display); font-stretch: 112.5%; letter-spacing: -0.05em; text-transform: uppercase; color: var(--ink); }
  h1 span { display: block; } h1 em { font-style: normal; color: var(--blue-ink); }
  h1 b { background: var(--lime); color: var(--on-lime); padding: 0 0.08em; font-weight: 800; }
  p { margin: 28px 0 0; font: 400 24px/34px var(--font-sans); color: var(--ink-muted); }
  .rec { position: absolute; z-index: 2; right: 64px; top: 72px; font: 600 15px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
  .rec b { color: var(--red); }
</style>
</head>
<body>
<div class="card">
  <svg width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
    <g id="ruler"></g>
    <line class="track" x1="720" y1="300" x2="1200" y2="300" />
    <line class="track" x1="720" y1="380" x2="1200" y2="380" />
    <line class="track" x1="720" y1="460" x2="1200" y2="460" />
    <rect class="blue" x="768" y="272" width="208" height="56" rx="4" />
    <rect class="ink" x="880" y="352" width="224" height="56" rx="4" />
    <rect class="lime" x="1008" y="432" width="256" height="56" rx="4" />
    <rect class="kf" x="759" y="171" width="18" height="18" transform="rotate(45 768 180)" />
    <rect class="kf" x="871" y="171" width="18" height="18" transform="rotate(45 880 180)" />
    <rect class="kf-on" x="999" y="171" width="18" height="18" transform="rotate(45 1008 180)" />
    <line class="head" x1="1072" y1="196" x2="1072" y2="540" />
    <path class="headfill" d="M1060 156h24v14l-12 12-12-12z" />
  </svg>
  <div class="rec"><b>● Rec</b> · turnframe.rs</div>
  <div class="text">
    <div class="mark">
      <svg width="48" height="48" viewBox="0 0 32 32" style="position:static"><path class="br" d="M9 3H4v26h5M23 3h5v26h-5"/><path class="kf2" d="M16 9.5L22.5 16L16 22.5L9.5 16Z"/></svg>
      turnframe
    </div>
    <h1><span>Models propose.</span><span><em>Code decides.</em></span><span>Events <b>confirm.</b></span></h1>
    <p>Deterministic conversational workflows for Rust. Mini models read; your code decides.</p>
  </div>
</div>
<script>
  const ruler = document.getElementById('ruler');
  for (let x = 720; x <= 1200; x += 16) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const long = (x - 720) % 64 === 0;
    line.setAttribute('class', 'tick');
    line.setAttribute('x1', x); line.setAttribute('x2', x);
    line.setAttribute('y1', long ? 150 : 162); line.setAttribute('y2', 176);
    ruler.append(line);
  }
</script>
</body>
</html>

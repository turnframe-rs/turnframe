id = "conversation.extra_quantity_corrected.en"
name = "An extra's quantity corrected beside a question changes that extra"
tags = ["conversation", "en"]

[[before]]
text = "100 euro each for 12 lounge passes"

[turn]
text = "which options do I have? also the lounge passes are actually 13"

[setup]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Trip 1"
revision = 3

[setup.cases.state]
status = "draft"

[setup.cases.state.traveler]
traveler_id = "5c1e0000-0000-4000-8000-000000000001"
display_name = "Marta Bianchi"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

[expect]

[[expect.case_state]]
case_id = "trip-1"
path = "/extras/0/quantity"
equals = 13

[[expect.case_state]]
case_id = "trip-1"
path = "/extras/0/unit_price_cents"
equals = 10000

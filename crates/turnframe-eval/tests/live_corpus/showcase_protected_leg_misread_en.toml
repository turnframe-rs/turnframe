id = "showcase.protected_leg_misread.en"
name = "The flight out is rebooked and the one back is kept, however the legs are named"
description = """
«The flight out» and «the one back» name the legs without their numbers: a reading that \
rebooks the wrong one is held by the turn's condition or refused by the lock.
"""
tags = ["showcase", "constraint", "en"]

[turn]
text = "rebook the flight out, keep the one back as it is"

[setup]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Trip 1"
revision = 3

[setup.cases.state]
status = "draft"
name = "Lisbon offsite"
travel_date = "2026-10-05"

[setup.cases.state.traveler]
traveler_id = "5c1e0000-0000-4000-8000-000000000001"
display_name = "Marta Bianchi"

[[setup.cases.state.extras]]
extra_id = "4cd2bc71-4b2e-87e2-a6a2-f7436f18babe"
description = "Checked bag"
quantity = 1
unit_price_cents = 4000
payer = "airline"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

[setup.cases.state.offer]
leg = 1
flight = "AZ612"
departs = "2026-10-05 13:10"
fare_difference_cents = 8400

[expect]

[[expect.case_state]]
case_id = "trip-1"
path = "/status"
equals = "awaiting_rebooking_confirmation"

[[expect.case_state]]
case_id = "trip-1"
path = "/offer/leg"
equals = 1

[[expect.interaction_status]]
workflow = "trip"
case_id = "trip-1"
statuses = ["active"]

[[expect.case_state]]
case_id = "trip-1"
path = "/legs/1/departs"
unchanged = true

[[expect.case_state]]
case_id = "trip-1"
path = "/legs/1/flight"
unchanged = true

[expect.forbid]
commands = ["trip.rebook"]

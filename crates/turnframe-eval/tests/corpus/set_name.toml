id = "trip.set_name"
name = "Setting the name commits exactly one command"
description = """
One field, one command, one event, one revision. The forbidden list is the half \
of the item that matters most: a turn that also sent a rebooking would \
satisfy every positive assertion here.
"""
tags = ["trip", "write"]
judge = ["language_quality"]

[turn]
text = "Set the name to Lisbon"
locale = "en-GB"

[expect]
commands = ["trip.set_name"]
events = ["trip.name_set"]
blocks = ["transition", "receipt"]
turn_phase = "delivered"

[[expect.acts]]
kind = "apply_operation"
operation = "trip.set_name"

[[expect.target_resolution]]
act_index = 0
resolution = "exact"
case_id = "trip-1"

[[expect.case_revision]]
workflow = "trip"
case_id = "trip-1"
revision = 4

[[expect.interaction_status]]
workflow = "trip"
case_id = "trip-1"
statuses = []

[expect.forbid]
commands = ["trip.rebook", "trip.withdraw"]
events = ["trip.rebooking_sent"]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Trip 1"
revision = 3

[setup.cases.state]
status = "draft"

[setup.cases.state.traveler]
traveler_id = "5c1e0000-0000-4000-8000-000000000001"
display_name = "Marta Bianchi"

[[setup.cases.state.extras]]
extra_id = "11111111-1111-4111-8111-111111111111"
description = "Checked bag"
quantity = 1
unit_price_cents = 25000
payer = "airline"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

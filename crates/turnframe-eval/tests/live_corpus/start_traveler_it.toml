id = "start.traveler.it"
name = "Chiedere un nuovo viaggiatore apre una bozza"
description = """
A traveler can be added while a trip is being filled in, which is the sample \
traveler workflow's start precondition, so the setup holds one.
"""
tags = ["start", "it"]

[turn]
text = "registra un nuovo viaggiatore"
locale = "it-IT"

[setup]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Viaggio 1"
revision = 3

[setup.cases.state]
status = "draft"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

[expect]
events = ["traveler.draft_created"]

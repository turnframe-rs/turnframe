[package]
name = "turnframe-store"
description = "Object-safe persistence traits and the deterministic in-memory store for Turnframe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
turnframe-core = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest = { workspace = true }

# Spec §28: persistence time is measured on its own, against the in-memory
# store, and nothing is claimed until it is (docs/benchmarks.md).
[[bench]]
name = "persistence"
harness = false

[lints]
workspace = true

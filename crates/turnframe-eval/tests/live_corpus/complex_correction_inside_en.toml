id = "complex.correction_inside.en"
name = "Two extras, one corrected in the same breath, and nothing rebooked"
tags = ["complex", "en"]

[turn]
text = "Add an extra for the hotel night at 150 euros, no wait, 135, and one for the airport transfer at 40 euros; don't rebook anything yet."

[setup]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Trip 1"
revision = 3

[setup.cases.state]
status = "draft"

[setup.cases.state.traveler]
traveler_id = "5c1e0000-0000-4000-8000-000000000001"
display_name = "Marta Bianchi"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

[expect]

[[expect.case_state]]
case_id = "trip-1"
path = "/extras/0/unit_price_cents"
equals = 13500

[[expect.case_state]]
case_id = "trip-1"
path = "/extras/1/unit_price_cents"
equals = 4000

[[expect.case_state]]
case_id = "trip-1"
path = "/extras/2"
absent = true

[expect.forbid]
events = ["trip.rebooking_requested", "trip.rebooking_sent"]

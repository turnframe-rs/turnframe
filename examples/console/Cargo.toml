[package]
name = "console"
description = "Turnframe example: an interactive console that runs a whole flow against a real model provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
turnframe = { workspace = true, features = [
    "test-kit",
    "openai",
    "anthropic",
    "gemini",
    "ollama",
] }
anyhow = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid = { workspace = true }

[lints]
workspace = true

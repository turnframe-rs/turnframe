[workspace]
resolver = "3"
members = [
    "crates/turnframe-core",
    "crates/turnframe-macros",
    "crates/turnframe-store",
    "crates/turnframe-store-postgres",
    "crates/turnframe-prompt",
    "crates/turnframe-provider",
    "crates/turnframe-telemetry",
    "crates/turnframe-tasks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
homepage = "https://turnframe.rs"
repository = "https://github.com/turnframe-rs/turnframe"
documentation = "https://docs.rs/turnframe"
authors = ["Turnframe contributors"]
keywords = ["llm", "workflow", "conversation", "deterministic", "orchestration"]
categories = ["asynchronous", "api-bindings"]

[workspace.dependencies]
# Intra-workspace crates
turnframe                    = { path = "crates/turnframe", version = "0.1.0" }
turnframe-core               = { path = "crates/turnframe-core", version = "0.1.0" }
turnframe-runtime            = { path = "crates/turnframe-runtime", version = "0.1.0" }
turnframe-macros             = { path = "crates/turnframe-macros", version = "0.1.0" }
turnframe-store              = { path = "crates/turnframe-store", version = "0.1.0" }
turnframe-store-postgres     = { path = "crates/turnframe-store-postgres", version = "0.1.0" }
turnframe-prompt             = { path = "crates/turnframe-prompt", version = "0.1.0" }
turnframe-provider           = { path = "crates/turnframe-provider", version = "0.1.0" }
turnframe-provider-openai    = { path = "crates/turnframe-provider-openai", version = "0.1.0" }
turnframe-provider-anthropic = { path = "crates/turnframe-provider-anthropic", version = "0.1.0" }
turnframe-provider-gemini    = { path = "crates/turnframe-provider-gemini", version = "0.1.0" }
turnframe-provider-bedrock   = { path = "crates/turnframe-provider-bedrock", version = "0.1.0" }
turnframe-provider-ollama    = { path = "crates/turnframe-provider-ollama", version = "0.1.0" }
turnframe-eval               = { path = "crates/turnframe-eval", version = "0.1.0" }
turnframe-test               = { path = "crates/turnframe-test", version = "0.1.0" }
turnframe-telemetry          = { path = "crates/turnframe-telemetry", version = "0.1.0" }
turnframe-tasks              = { path = "crates/turnframe-tasks", version = "0.1.0" }
turnframe-understand         = { path = "crates/turnframe-understand", version = "0.1.0" }

# Shared external dependencies
async-trait        = "0.1"
base64             = "0.23"
blake3             = "1"
bytes              = "1"
chrono             = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
eventsource-stream = "0.2"
futures            = "0.3"
indexmap           = { version = "2", features = ["serde"] }
jsonschema         = { version = "0.56", default-features = false }
metrics            = "0.24"
opentelemetry      = "0.32"
opentelemetry_sdk  = { version = "0.32", features = ["trace"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars           = { version = "1", features = ["preserve_order", "chrono04", "uuid1"] }
secrecy            = { version = "0.10", features = ["serde"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1", features = ["preserve_order"] }
sqlx               = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror          = "2"
tokio              = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-stream       = "0.1"
toml               = "1.1"
tower              = "0.5"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid               = { version = "1", features = ["v4", "v7", "serde"] }
aws-config              = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-bedrockruntime  = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-smithy-types        = "1"
aws-credential-types    = "1"

# Test, bench and example dependencies
criterion  = { version = "0.8", features = ["html_reports"] }
insta      = { version = "1", features = ["json", "yaml"] }
proptest   = "1"
wiremock   = "0.6"
anyhow     = "1"
dotenvy    = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
missing_errors_doc = "allow"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1

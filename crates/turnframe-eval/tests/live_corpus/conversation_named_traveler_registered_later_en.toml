id = "conversation.named_traveler_registered_later.en"
name = "A traveler named before it existed is put on the trip when registered turns later"
tags = ["conversation", "en"]

[[before]]
text = "the trip is for Omar Haddad"

[[before]]
text = "set the name to Lisbon"

[turn]
text = "ok, register Omar Haddad"

[setup]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Trip 1"
revision = 1

[setup.cases.state]
status = "draft"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

[expect]

[[expect.case_count]]
workflow = "traveler"
count = 1

[[expect.case_state]]
case_id = "trip-1"
path = "/traveler/display_name"
equals = "Omar Haddad"
ignore_case = true

[[expect.case_state]]
case_id = "trip-1"
path = "/name"
equals = "Lisbon"
ignore_case = true

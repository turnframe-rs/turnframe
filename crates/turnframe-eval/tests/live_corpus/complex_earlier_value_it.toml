id = "complex.earlier_value.it"
name = "Un extra e un nome detto in un messaggio precedente"
tags = ["complex", "it"]
description = "The name was stated two messages earlier and is referred back to."

[turn]
text = "3 notti d'albergo a 50 euro a notte, e come nome metti quello che ti ho detto prima."
locale = "it-IT"

[setup]

[[setup.cases]]
workflow = "trip"
case_id = "trip-1"
label = "Viaggio 1"
revision = 3

[setup.cases.state]
status = "draft"

[setup.cases.state.traveler]
traveler_id = "5c1e0000-0000-4000-8000-000000000001"
display_name = "Marta Bianchi"

[[setup.cases.state.legs]]
number = 1
flight = "AZ610"
from = "FCO"
to = "LIS"
departs = "2026-10-05 07:40"
status = "cancelled"

[[setup.cases.state.legs]]
number = 2
flight = "AZ611"
from = "LIS"
to = "FCO"
departs = "2026-10-09 18:20"
status = "on_time"

[[setup.history]]
user = "il viaggio è per l'offsite di Lisbona"
assistant = "Che cosa aggiungo alla pratica?"

[expect]

[[expect.case_state]]
case_id = "trip-1"
path = "/name"
one_of = ["offsite di Lisbona", "l'offsite di Lisbona"]
ignore_case = true

[[expect.case_state]]
case_id = "trip-1"
path = "/extras/0/quantity"
equals = 3

[[expect.case_state]]
case_id = "trip-1"
path = "/extras/0/unit_price_cents"
equals = 5000
